name: Test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      # La suite nel browser usa Chromium: sui runner di GitHub c'è già.
      - run: npm test
        working-directory: backend
        env:
          CHROME_PATH: /usr/bin/google-chrome
